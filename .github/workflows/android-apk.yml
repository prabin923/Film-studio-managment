name: Build Android APK

# Builds a directly-installable debug APK in the cloud (no local Android SDK
# needed). Download it from the run's Artifacts, transfer to an Android phone,
# and install (allow "install from unknown sources").

on:
  push:
    branches: [android-app, main]
    paths:
      - "android/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedstudio-os-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
